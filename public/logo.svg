<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad-agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0F172A" stroke="url(#grad-agent)" stroke-width="2.5" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="50" cy="50" r="30" stroke="url(#grad-glow)" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  
  <!-- AI Agent Sparkle & Pulse Ring -->
  <path d="M50 22 C51 35 62 48 76 50 C62 52 51 65 50 78 C49 65 38 52 24 50 C38 48 49 35 50 22 Z" fill="url(#grad-agent)" filter="url(#glow)" />
  
  <!-- Center Core Node -->
  <circle cx="50" cy="50" r="7" fill="#FFFFFF" />
  
  <!-- Connecting Orbital Nodes -->
  <circle cx="70" cy="30" r="3.5" fill="#38BDF8" />
  <circle cx="30" cy="70" r="3" fill="#F43F5E" />
  <circle cx="30" cy="30" r="2.5" fill="#A855F7" />
  <circle cx="70" cy="70" r="3" fill="#10B981" />
  
  <!-- Network links -->
  <line x1="50" y1="50" x2="70" y2="30" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 2" />
  <line x1="50" y1="50" x2="30" y2="70" stroke="#F43F5E" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 2" />
</svg>
